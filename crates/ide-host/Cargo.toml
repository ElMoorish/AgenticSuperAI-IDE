[package]
name = "ide-host"
version = "0.1.0"
edition.workspace = true
# 1.77.2 has the std fix for batch-file (.cmd/.bat) argument escaping we rely on;
# 1.79 adds str::utf8_chunks used by terminals.rs.
rust-version = "1.79"
license.workspace = true

[[bin]]
name = "mock_agent"
path = "tests/bin/mock_agent.rs"
test = false

[dependencies]
dunce = "1"
notify = "8"
portable-pty = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["process", "io-util", "io-std", "sync", "time", "rt-multi-thread", "macros"] }
ureq = { version = "2", features = ["json"] }

[dev-dependencies]
tempfile = "3"
