[package]
name = "ide-host"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[[bin]]
name = "mock_agent"
path = "tests/bin/mock_agent.rs"
test = false

[dependencies]
dunce = "1"
portable-pty = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["process", "io-util", "io-std", "sync", "time", "rt-multi-thread", "macros"] }

[dev-dependencies]
tempfile = "3"
